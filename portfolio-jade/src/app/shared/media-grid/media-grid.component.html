<section class="media-rail">
  <div class="rail-wrapper">
    @if (canScrollLeft) {
      <button class="nav-arrow left" type="button" (click)="scrollLeft()">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    }

    <div #track class="rail-track" (scroll)="onTrackScroll()">
      @for (item of items; track item.id) {
        <div class="rail-item">
          <app-media-card [data]="item" (open)="open(item)"> </app-media-card>
        </div>
      }
    </div>

    @if (canScrollRight) {
      <button class="nav-arrow right" type="button" (click)="scrollRight()">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    }
  </div>
</section>

@if (selectedMedia) {
  <app-media-lightbox [item]="selectedMedia" (close)="close()"> </app-media-lightbox>
}
